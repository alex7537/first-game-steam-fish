<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#061824">
  <title>Fish Lab v0.2 · 多鱼同缸</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      --ink: #eafaff;
      --muted: #91b7c6;
      --line: #24526a;
      --panel: #0a2233e8;
      --accent: #72e4ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      background: radial-gradient(circle at 50% -20%, #174b65, #061824 45%, #030e17);
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    main { width: min(1180px, 94vw); margin: 0 auto; padding: 34px 0 48px; }
    header { display: flex; align-items: end; justify-content: space-between; gap: 20px; margin-bottom: 20px; }
    h1 { margin: 0; font-size: clamp(2.2rem, 6vw, 4.8rem); letter-spacing: -.06em; line-height: .95; }
    h1 span { color: var(--accent); }
    .lead { max-width: 540px; margin: 8px 0 0; color: var(--muted); }
    .version { flex: none; padding: 7px 11px; border: 1px solid #4ca1bd; border-radius: 999px; color: #bdf3ff; background: #092a3b; }
    .toolbar {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto auto;
      gap: 10px;
      margin-bottom: 12px;
    }
    input, .action {
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--ink);
      background: #071b2a;
    }
    input { padding: 13px 15px; outline: none; }
    input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #72e4ff18; }
    .action { padding: 12px 16px; font-weight: 750; }
    .action.primary { color: #03151d; border-color: #8beaff; background: var(--accent); }
    .action:hover { filter: brightness(1.12); }
    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: 12px; }
    .tank-shell, .inspector {
      border: 1px solid var(--line);
      border-radius: 18px;
      background: var(--panel);
      box-shadow: 0 24px 70px #010b12aa;
    }
    .tank-shell { padding: 10px; overflow: hidden; }
    .tank-meta { display: flex; justify-content: space-between; gap: 12px; padding: 3px 5px 10px; color: var(--muted); font-size: .88rem; }
    #aquarium {
      position: relative;
      height: clamp(400px, 56vw, 610px);
      overflow: hidden;
      isolation: isolate;
      border-radius: 12px;
      background:
        radial-gradient(circle at 16% 15%, #d8fbff33 0 2px, transparent 3px),
        radial-gradient(circle at 82% 34%, #d8fbff26 0 3px, transparent 4px),
        linear-gradient(180deg, #0a6687, #084366 58%, #092b42);
    }
    #aquarium::before {
      content: "";
      position: absolute;
      inset: auto 0 0;
      height: 52px;
      z-index: -1;
      background: linear-gradient(#bda26a, #806644);
      clip-path: polygon(0 38%, 8% 14%, 17% 36%, 30% 17%, 42% 39%, 58% 12%, 70% 36%, 86% 18%, 100% 42%, 100% 100%, 0 100%);
    }
    #aquarium::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: linear-gradient(105deg, transparent 12%, #d8fbff0d 13% 20%, transparent 21% 68%, #d8fbff0a 69% 75%, transparent 76%);
    }
    .plant { position: absolute; bottom: 32px; width: 12px; border-radius: 100% 0; transform-origin: bottom; background: #207b67; opacity: .85; }
    .plant.one { left: 7%; height: 94px; transform: rotate(-9deg); }
    .plant.two { left: 10%; height: 130px; transform: rotate(7deg); }
    .plant.three { right: 8%; height: 112px; transform: rotate(-5deg); }
    .fish {
      position: absolute;
      left: 0;
      top: 0;
      width: 150px;
      height: 84px;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      transform-origin: center;
      will-change: transform;
      filter: drop-shadow(0 8px 6px #00121d55);
    }
    .fish svg { display: block; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
    .fish:hover { filter: brightness(1.1) drop-shadow(0 8px 7px #00121d77); }
    .fish.selected { filter: drop-shadow(0 0 7px #fff) drop-shadow(0 0 15px var(--accent)); }
    .fish.selected::after {
      content: "";
      position: absolute;
      inset: -9px;
      border: 2px solid #d9faffaa;
      border-radius: 50%;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 50% { opacity: .35; transform: scale(1.08); } }
    .inspector { padding: 18px; }
    .inspector h2 { margin: 0 0 5px; font-size: 1.1rem; }
    .inspector .empty { color: var(--muted); line-height: 1.55; }
    .gene-list { margin: 15px 0; display: grid; grid-template-columns: 1fr auto; gap: 8px; font-size: .9rem; }
    .gene-list dt { color: var(--muted); }
    .gene-list dd { margin: 0; text-align: right; }
    .swatch { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid #fff8; border-radius: 50%; vertical-align: -1px; }
    .inspector-actions { display: grid; gap: 8px; }
    .inspector-actions button { padding: 10px; border: 1px solid var(--line); border-radius: 10px; color: var(--ink); background: #0b2a3c; }
    .inspector-actions .danger { color: #ffc8c8; border-color: #8a454b; background: #351c26; }
    .note { margin: 14px 3px 0; color: var(--muted); font-size: .88rem; }
    @media (max-width: 800px) {
      header { align-items: start; }
      .toolbar { grid-template-columns: 1fr 1fr; }
      .toolbar input { grid-column: 1 / -1; }
      .workspace { grid-template-columns: 1fr; }
      .inspector { min-height: 180px; }
    }
    @media (max-width: 480px) { .action { padding-inline: 8px; } .version { display: none; } }
    @media (prefers-reduced-motion: reduce) { .fish.selected::after { animation: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>Fish <span>Lab</span></h1>
        <p class="lead">把一句描述孵化成独一无二的鱼。点击鱼查看基因，点击水面空白处取消选择。</p>
      </div>
      <span class="version">v0.2 · 多鱼同缸</span>
    </header>

    <form class="toolbar" id="hatch-form">
      <input id="description" value="一条圆滚滚、金色、活泼的小鱼" aria-label="描述想孵化的鱼" maxlength="80">
      <button class="action primary" type="submit">孵化新鱼</button>
      <button class="action" id="mutate-button" type="button">随机变异</button>
    </form>

    <section class="workspace">
      <div class="tank-shell">
        <div class="tank-meta">
          <span id="population">鱼群 0 / 12</span>
          <span id="message" aria-live="polite">鱼缸准备好了</span>
        </div>
        <div id="aquarium" aria-label="多鱼生态缸">
          <i class="plant one"></i><i class="plant two"></i><i class="plant three"></i>
        </div>
      </div>

      <aside class="inspector" id="inspector">
        <h2>基因观察台</h2>
        <p class="empty">选择一条鱼后，可以查看它不随帧变化的基因、导出 SVG，或将它放生。</p>
      </aside>
    </section>
    <p class="note">提示：鱼的基因和实时运动状态分开保存；鱼缸最多容纳 12 条鱼。</p>
  </main>

  <script>
    const MAX_FISH = 12;
    const FISHES = [];
    const aquarium = document.querySelector('#aquarium');
    const inspector = document.querySelector('#inspector');
    const population = document.querySelector('#population');
    const message = document.querySelector('#message');
    let selectedId = null;
    let lastTime = performance.now();
    let nextId = 1;

    const pick = list => list[Math.floor(Math.random() * list.length)];
    const range = (min, max) => min + Math.random() * (max - min);
    const clamp = (value, min, max) => Math.max(min, Math.min(max, value));
    const contains = (text, words) => words.some(word => text.includes(word));

    function randomGene(description = '') {
      const palettes = [
        ['#ffc857', '#ff7b54'], ['#64d8ff', '#5267d8'], ['#ff6f91', '#9d4edd'],
        ['#85e89d', '#20a486'], ['#c9a7ff', '#6f67d8'], ['#ff9671', '#f9f871']
      ];
      let [color, secondary] = pick(palettes);
      if (contains(description, ['金', '黄'])) [color, secondary] = ['#ffc857', '#ff8c42'];
      if (contains(description, ['蓝', '海'])) [color, secondary] = ['#62d8ff', '#3b5bdb'];
      if (contains(description, ['红', '火'])) [color, secondary] = ['#ff6b6b', '#b9385a'];
      if (contains(description, ['绿', '森林'])) [color, secondary] = ['#85e89d', '#169c87'];
      if (contains(description, ['紫'])) [color, secondary] = ['#c29cff', '#7048c8'];

      return Object.freeze({
        id: `FL-${String(nextId++).padStart(3, '0')}`,
        color,
        secondary,
        size: contains(description, ['巨大', '大鱼']) ? 1.28 : contains(description, ['小巧', '小鱼', '迷你']) ? .72 : range(.86, 1.1),
        aspect: contains(description, ['瘦长', '修长']) ? 1.28 : contains(description, ['圆滚滚', '圆胖', '胖']) ? .78 : range(.9, 1.12),
        speed: contains(description, ['安静', '缓慢', '慵懒']) ? .62 : contains(description, ['活泼', '快速', '敏捷']) ? 1.38 : range(.82, 1.12),
        temperament: contains(description, ['安静', '慵懒']) ? '安静' : contains(description, ['活泼', '敏捷']) ? '活泼' : pick(['好奇', '温和', '机警']),
        pattern: pick(['斑点', '条纹', '纯色']),
        fin: pick(['扇形', '月牙', '短鳍'])
      });
    }

    function mutateGene(parent) {
      const base = parent || randomGene();
      const hue = Math.floor(range(0, 360));
      return Object.freeze({
        ...base,
        id: `FL-${String(nextId++).padStart(3, '0')}`,
        color: `hsl(${hue} 78% 65%)`,
        secondary: `hsl(${(hue + range(35, 90)) % 360} 70% 48%)`,
        size: clamp(base.size * range(.82, 1.18), .65, 1.38),
        aspect: clamp(base.aspect * range(.88, 1.12), .7, 1.35),
        speed: clamp(base.speed * range(.8, 1.2), .5, 1.55),
        temperament: pick(['好奇', '温和', '机警', '活泼', '安静']),
        pattern: pick(['斑点', '条纹', '纯色']),
        fin: pick(['扇形', '月牙', '短鳍'])
      });
    }

    function fishSvg(gene) {
      const pattern = gene.pattern === '斑点'
        ? `<circle cx="93" cy="35" r="8" fill="${gene.secondary}" opacity=".75"/><circle cx="69" cy="61" r="6" fill="${gene.secondary}" opacity=".68"/>`
        : gene.pattern === '条纹'
          ? `<path d="M67 24 Q58 50 68 74 M91 20 Q82 50 92 79" fill="none" stroke="${gene.secondary}" stroke-width="10" opacity=".55"/>`
          : '';
      const tail = gene.fin === '月牙'
        ? 'M44 50 Q13 15 19 8 Q52 23 55 50 Q52 77 19 92 Q13 85 44 50Z'
        : gene.fin === '短鳍'
          ? 'M50 50 L22 29 L27 50 L22 71 Z'
          : 'M50 50 L13 15 L22 50 L13 85 Z';
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100" role="img" aria-label="${gene.id}">
        <defs><linearGradient id="body-${gene.id}" x1="0" x2="1"><stop stop-color="${gene.secondary}"/><stop offset=".5" stop-color="${gene.color}"/><stop offset="1" stop-color="${gene.color}"/></linearGradient></defs>
        <path d="${tail}" fill="${gene.secondary}"/>
        <ellipse cx="100" cy="50" rx="58" ry="34" fill="url(#body-${gene.id})"/>
        ${pattern}
        <path d="M87 24 Q105 2 117 25" fill="${gene.secondary}" opacity=".8"/>
        <circle cx="137" cy="39" r="7" fill="#f4fdff"/><circle cx="139" cy="39" r="3" fill="#071824"/>
        <path d="M149 58 Q157 63 164 56" fill="none" stroke="#572c3a" stroke-width="3" stroke-linecap="round"/>
      </svg>`;
    }

    function createFish(gene) {
      if (FISHES.length >= MAX_FISH) {
        announce('鱼缸已满，请先放生一条鱼');
        return null;
      }
      const node = document.createElement('button');
      node.type = 'button';
      node.className = 'fish';
      node.innerHTML = fishSvg(gene);
      node.setAttribute('aria-label', `选择鱼 ${gene.id}`);
      node.addEventListener('click', event => {
        event.stopPropagation();
        selectFish(gene.id);
      });

      const bounds = aquarium.getBoundingClientRect();
      const angle = range(0, Math.PI * 2);
      const entity = {
        gene,
        node,
        x: range(90, Math.max(91, bounds.width - 90)),
        y: range(65, Math.max(66, bounds.height - 105)),
        vx: Math.cos(angle) * 35 * gene.speed,
        vy: Math.sin(angle) * 13 * gene.speed,
        targetVx: Math.cos(angle) * 45 * gene.speed,
        targetVy: Math.sin(angle) * 18 * gene.speed,
        wanderIn: range(2, 6),
        facing: Math.cos(angle) < 0 ? -1 : 1
      };
      FISHES.push(entity);
      aquarium.append(node);
      updatePopulation();
      announce(`${gene.id} 已加入鱼缸`);
      return entity;
    }

    function selectFish(id) {
      selectedId = id;
      for (const fish of FISHES) fish.node.classList.toggle('selected', fish.gene.id === id);
      renderInspector();
    }

    function clearSelection() {
      selectedId = null;
      for (const fish of FISHES) fish.node.classList.remove('selected');
      renderInspector();
    }

    function renderInspector() {
      const fish = FISHES.find(item => item.gene.id === selectedId);
      if (!fish) {
        inspector.innerHTML = '<h2>基因观察台</h2><p class="empty">选择一条鱼后，可以查看它不随帧变化的基因、导出 SVG，或将它放生。</p>';
        return;
      }
      const gene = fish.gene;
      inspector.innerHTML = `
        <h2>${gene.id}</h2>
        <p class="empty">基因是身份；位置和速度是实时状态。</p>
        <dl class="gene-list">
          <dt>主色</dt><dd><i class="swatch" style="background:${gene.color}"></i>${gene.color}</dd>
          <dt>体型</dt><dd>${gene.size.toFixed(2)}</dd>
          <dt>长宽比</dt><dd>${gene.aspect.toFixed(2)}</dd>
          <dt>速度</dt><dd>${gene.speed.toFixed(2)}</dd>
          <dt>性格</dt><dd>${gene.temperament}</dd>
          <dt>花纹</dt><dd>${gene.pattern}</dd>
          <dt>尾鳍</dt><dd>${gene.fin}</dd>
        </dl>
        <div class="inspector-actions">
          <button id="export-button" type="button">导出 SVG</button>
          <button id="release-button" class="danger" type="button">放生这条鱼</button>
        </div>`;
      document.querySelector('#export-button').addEventListener('click', () => exportFish(fish));
      document.querySelector('#release-button').addEventListener('click', () => releaseFish(fish));
    }

    function exportFish(fish) {
      const blob = new Blob([fishSvg(fish.gene)], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = `${fish.gene.id}.svg`;
      link.click();
      URL.revokeObjectURL(url);
      announce(`${fish.gene.id} 的 SVG 已导出`);
    }

    function releaseFish(fish) {
      const index = FISHES.indexOf(fish);
      if (index < 0) return;
      FISHES.splice(index, 1);
      fish.node.remove();
      clearSelection();
      updatePopulation();
      announce(`${fish.gene.id} 已被放生`);
    }

    function updatePopulation() {
      population.textContent = `鱼群 ${FISHES.length} / ${MAX_FISH}`;
    }

    function announce(text) {
      message.textContent = text;
    }

    // 游戏循环（核心！）
    // 每一帧依次处理：意图 → 惯性 → 积分 → 碰壁 → 写回渲染。
    function tick(now) {
      const dt = Math.min((now - lastTime) / 1000, .05); // 秒；保证不同刷新率下速度一致
      lastTime = now;
      const bounds = aquarium.getBoundingClientRect();

      for (const fish of FISHES) {
        const { gene } = fish;

        // 1. 意图：wander 每 2~6 秒产生一个新的目标速度。
        fish.wanderIn -= dt;
        if (fish.wanderIn <= 0) {
          const direction = Math.random() < .5 ? -1 : 1;
          fish.targetVx = direction * range(30, 58) * gene.speed;
          fish.targetVy = range(-22, 22) * gene.speed;
          fish.wanderIn = range(2, 6);
        }

        // 2. 惯性：用指数平滑让当前速度逐渐靠近目标速度。
        const easing = 1 - Math.exp(-2.4 * dt);
        fish.vx += (fish.targetVx - fish.vx) * easing;
        fish.vy += (fish.targetVy - fish.vy) * easing;

        // 3. 积分：位置 += 速度 × dt（帧率无关）。
        fish.x += fish.vx * dt;
        fish.y += fish.vy * dt;

        // 4. 碰壁反弹：当前速度和目标速度同时反向，防止贴墙抽搐。
        const halfWidth = 64 * gene.size * gene.aspect;
        const halfHeight = 38 * gene.size;
        const minX = halfWidth;
        const maxX = Math.max(minX, bounds.width - halfWidth);
        const minY = halfHeight;
        const maxY = Math.max(minY, bounds.height - halfHeight - 38);
        if (fish.x <= minX || fish.x >= maxX) {
          fish.x = clamp(fish.x, minX, maxX);
          fish.vx *= -1;
          fish.targetVx *= -1;
        }
        if (fish.y <= minY || fish.y >= maxY) {
          fish.y = clamp(fish.y, minY, maxY);
          fish.vy *= -1;
          fish.targetVy *= -1;
        }
        if (Math.abs(fish.vx) > 2) fish.facing = fish.vx < 0 ? -1 : 1;

        // 5. 写回渲染：逻辑更新结束后统一更新 DOM；向左游时水平翻转。
        fish.node.style.transform = `translate3d(${fish.x - 75}px, ${fish.y - 42}px, 0) scale(${fish.facing * gene.size * gene.aspect}, ${gene.size})`;
        fish.node.style.zIndex = String(Math.round(fish.y));
      }
      requestAnimationFrame(tick);
    }

    document.querySelector('#hatch-form').addEventListener('submit', event => {
      event.preventDefault();
      const description = document.querySelector('#description').value.trim();
      createFish(randomGene(description));
    });

    document.querySelector('#mutate-button').addEventListener('click', () => {
      const selected = FISHES.find(fish => fish.gene.id === selectedId);
      createFish(mutateGene(selected?.gene));
    });

    aquarium.addEventListener('click', clearSelection);
    window.addEventListener('resize', () => {
      const bounds = aquarium.getBoundingClientRect();
      for (const fish of FISHES) {
        fish.x = clamp(fish.x, 40, Math.max(40, bounds.width - 40));
        fish.y = clamp(fish.y, 35, Math.max(35, bounds.height - 75));
      }
    });

    // 开场自带三条随机鱼。
    requestAnimationFrame(() => {
      createFish(randomGene('金色活泼小鱼'));
      createFish(randomGene('蓝色瘦长安静'));
      createFish(randomGene('红色圆滚滚'));
      lastTime = performance.now();
      requestAnimationFrame(tick);
    });
  </script>
</body>
</html>
