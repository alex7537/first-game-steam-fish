<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fish Lab v0.3</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; --blue:#72e4ff; --orange:#ffad4d; }
    * { box-sizing: border-box; }
    body { margin:0; color:#effcff; background:#061722; }
    main { width:min(1160px,94vw); margin:auto; padding:32px 0 50px; }
    h1 { margin:0; font-size:clamp(2.4rem,6vw,4.8rem); letter-spacing:-.06em; }
    h1 span { color:var(--blue); }
    .lead,.hint,.empty { color:#91b4c2; }
    .toolbar { display:grid; grid-template-columns:1fr repeat(3,auto); gap:9px; margin:20px 0 12px; }
    input,button { border:1px solid #28566c; border-radius:11px; font:inherit; }
    input { min-width:0; padding:12px 14px; color:#fff; background:#071b29; }
    button { padding:10px 14px; color:#effcff; background:#0b2a3c; cursor:pointer; }
    button:hover { filter:brightness(1.12); }
    .primary { color:#03151d; border-color:#9beeff; background:var(--blue); font-weight:700; }
    #pair-button.active { color:#241400; border-color:#ffd39f; background:var(--orange); }
    .workspace { display:grid; grid-template-columns:minmax(0,1fr) 260px; gap:12px; }
    .panel { border:1px solid #28566c; border-radius:17px; background:#092131; }
    .tank { padding:10px; transition:.2s; }
    .tank.pairing { border-color:var(--orange); box-shadow:0 0 0 2px #ffad4d44; }
    .tank-meta { display:flex; justify-content:space-between; gap:10px; min-height:29px; padding:2px 4px 8px; color:#91b4c2; font-size:.88rem; }
    .tank.pairing .tank-meta { color:#ffd39f; }
    #aquarium { position:relative; height:clamp(400px,55vw,600px); overflow:hidden; border-radius:11px; background:linear-gradient(#0a6687,#084366 60%,#092b42); }
    #aquarium::after { content:""; position:absolute; inset:auto 0 0; height:42px; background:#9c8053; clip-path:polygon(0 35%,12% 10%,25% 38%,42% 18%,59% 40%,76% 12%,100% 38%,100% 100%,0 100%); }
    .fish { position:absolute; left:0; top:0; width:150px; height:108px; padding:0; border:0; background:transparent; will-change:transform; z-index:1; }
    .art { display:block; width:150px; height:82px; transform-origin:center; filter:drop-shadow(0 7px 5px #00141e77); }
    .art svg { width:100%; height:100%; overflow:visible; }
    .fish.selected .art { filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 15px var(--blue)); }
    .fish.parent .art { filter:drop-shadow(0 0 9px #fff) drop-shadow(0 0 16px var(--orange)); }
    .tag { position:absolute; left:50%; bottom:0; display:flex; gap:5px; width:max-content; padding:4px 7px; border:1px solid #8bc4d277; border-radius:99px; background:#03141cdd; font-size:10px; transform:translateX(-50%); }
    .badge { color:var(--rarity); font-weight:800; }
    .inspector { padding:17px; }
    .inspector h2,.codex h2 { margin:0 0 7px; }
    dl { display:grid; grid-template-columns:1fr auto; gap:7px; margin:14px 0; font-size:.86rem; }
    dt { color:#91b4c2; } dd { margin:0; text-align:right; }
    .inspector-actions { display:grid; gap:7px; }
    .danger { color:#ffcaca; border-color:#8a454b; background:#351c26; }
    .codex { margin-top:13px; padding:17px; }
    .codex-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .codex-head div { display:flex; gap:7px; }
    #codex-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:8px; margin-top:12px; }
    .species { display:grid; grid-template-columns:58px 1fr; align-items:center; gap:7px; padding:8px; text-align:left; border-color:var(--rarity); }
    .species svg { width:58px; height:44px; overflow:visible; }
    .species strong,.species small { display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .species small { color:var(--rarity); }
    @media (max-width:780px) { .toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.workspace{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <main>
    <h1>Fish <span>Lab</span></h1>
    <p class="lead">培育、变异、收藏你的程序化鱼群。</p>

    <form class="toolbar" id="hatch-form">
      <input id="description" value="一条圆滚滚、金色、活泼的小鱼" maxlength="80" aria-label="鱼的描述">
      <button class="primary" type="submit">孵化新鱼</button>
      <button id="random-button" type="button">随机变异</button>
      <button id="pair-button" type="button">💕 配对繁殖</button>
    </form>

    <section class="workspace">
      <div class="panel tank" id="tank">
        <div class="tank-meta"><span id="population">鱼群 0 / 12</span><span id="message" aria-live="polite">鱼缸准备好了</span></div>
        <div id="aquarium" aria-label="鱼缸"></div>
      </div>
      <aside class="panel inspector" id="inspector">
        <h2>基因观察台</h2>
        <p class="empty">点击一条鱼查看基因。选中后 Shift+点击另一条可快速繁殖。</p>
      </aside>
    </section>
    <p class="hint">配对模式下依次点击两条鱼。图鉴只存在内存里，刷新前请导出。</p>

    <section class="panel codex">
      <div class="codex-head">
        <h2>物种图鉴 <span id="codex-count">0</span></h2>
        <div><button id="export-codex">导出 JSON</button><button id="import-codex">导入 JSON</button></div>
        <input id="codex-file" type="file" accept=".json,application/json" hidden>
      </div>
      <div id="codex-grid"><p class="empty">还没有收录物种。</p></div>
    </section>
  </main>

  <script>
    const MAX_FISH = 12;
    const FISHES = [];
    const CODEX = new Map();
    const SHAPES = ['流线','圆胖','纤长'];
    const TAILS = ['扇尾','月牙尾','短尾'];
    const MUTANT_TAILS = ['彗星尾','双叶尾'];
    const FINS = ['短鳍','长鳍','蝶鳍','刺鳍'];
    const MOUTHS = ['微笑','嘟嘴','尖吻','方嘴'];
    const PATTERNS = ['纯色','斑点','条纹'];
    const PARTS = ['独角','发光鳍','长须','皇冠','星斑','双尾'];
    const RARITIES = {
      common:{label:'普通',color:'#9aafba',rank:0}, rare:{label:'稀有',color:'#55aaff',rank:1},
      epic:{label:'史诗',color:'#b87aff',rank:2}, legendary:{label:'传说',color:'#ffc64d',rank:3}
    };
    const aquarium = document.querySelector('#aquarium');
    const tank = document.querySelector('#tank');
    const inspector = document.querySelector('#inspector');
    const pairButton = document.querySelector('#pair-button');
    let selected = null;
    let pairing = false;
    let firstParent = null;
    let nextId = 1;
    let lastTime = performance.now();

    const pick = a => a[Math.floor(Math.random()*a.length)];
    const range = (a,b) => a+Math.random()*(b-a);
    const clamp = (x,a,b) => Math.max(a,Math.min(b,x));
    const has = (text,words) => words.some(word=>text.includes(word));
    const inherit = (a,b,key) => Math.random()<.5 ? a[key] : b[key];
    const id = () => `FL-${String(nextId++).padStart(3,'0')}`;
    const clean = value => String(value??'').replace(/[<>]/g,'').slice(0,80);

    function gauss() { return ((Math.random()+Math.random()+Math.random())/3-.5)*2; }
    function blend(a,b,min,max,noise) { const w=range(.2,.8); return clamp(a*w+b*(1-w)+gauss()*noise,min,max); }

    function toHsl(color) {
      const hsl=color.match(/^hsl\(([\d.]+) ([\d.]+)% ([\d.]+)%\)$/);
      if(hsl) return hsl.slice(1).map(Number);
      const hex=color.replace('#','');
      const full=hex.length===3 ? [...hex].map(x=>x+x).join('') : hex;
      const [r,g,b]=[0,2,4].map(i=>parseInt(full.slice(i,i+2),16)/255);
      const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min, l=(max+min)/2;
      let h=0;
      if(d) h=max===r?60*(((g-b)/d)%6):max===g?60*((b-r)/d+2):60*((r-g)/d+4);
      return [(h+360)%360,d?d/(1-Math.abs(2*l-1))*100:0,l*100];
    }

    function mixColor(a,b,w=range(.3,.7)) {
      const A=toHsl(a), B=toHsl(b), arc=((B[0]-A[0]+540)%360)-180;
      return `hsl(${((A[0]+arc*w+360)%360).toFixed(1)} ${(A[1]+(B[1]-A[1])*w).toFixed(1)}% ${(A[2]+(B[2]-A[2])*w).toFixed(1)}%)`;
    }

    function randomGene(text='') {
      const palettes=[['#ffc857','#ff7b54'],['#64d8ff','#5267d8'],['#ff6f91','#9d4edd'],['#85e89d','#20a486'],['#c9a7ff','#6f67d8']];
      let [color,accent]=pick(palettes);
      if(has(text,['金','黄'])) [color,accent]=['#ffc857','#ff8c42'];
      if(has(text,['蓝','海'])) [color,accent]=['#62d8ff','#3b5bdb'];
      if(has(text,['红','火'])) [color,accent]=['#ff6b6b','#b9385a'];
      const fatness=has(text,['圆','胖'])?1.28:has(text,['瘦','长'])?.72:range(.85,1.15);
      const name=pick(['泡泡','闪闪','月光','珊瑚','星砂','团团'])+pick(['斑鱼','仙鱼','灯鱼','尾鱼','锦鱼']);
      return {id:id(),name,generation:0,parents:[],mutations:[],color,accent,
        shape:fatness>1.2?'圆胖':fatness<.8?'纤长':pick(SHAPES),tail:pick(TAILS),fin:pick(FINS),mouth:pick(MOUTHS),pattern:pick(PATTERNS),
        eyeCount:pick([1,1,1,2,2,3,4,5,6]),size:has(text,['小'])?.72:has(text,['大'])?1.28:range(.85,1.12),fatness,eyeSize:range(.8,1.2),
        speed:has(text,['安静','慢'])?.62:has(text,['活泼','快'])?1.38:range(.8,1.15),parts:Math.random()<.06?[pick(PARTS)]:[]};
    }

    function crossGenes(a,b) {
      const mutations=[];
      const union=[...new Set([...a.parts,...b.parts])];
      const parts=union.filter(()=>Math.random()<.5);
      if(Math.random()<.08) {
        const available=PARTS.filter(part=>!union.includes(part));
        if(available.length) { const part=pick(available); parts.push(part); mutations.push(part); }
      }
      let tail=inherit(a,b,'tail');
      if(Math.random()<.05) { tail=pick(MUTANT_TAILS); mutations.push(tail); }
      let eyeCount=inherit(a,b,'eyeCount');
      if(Math.random()<.08) {
        eyeCount=clamp(eyeCount+pick([-1,1]),1,6);
        mutations.push('眼数');
      }
      return {
        id:id(),
        name:a.name.slice(0,2)+b.name.slice(-2),
        generation:Math.max(a.generation,b.generation)+1,
        parents:[a.id,b.id],
        mutations,
        color:mixColor(a.color,b.color),
        accent:mixColor(a.accent,b.accent),
        shape:inherit(a,b,'shape'),
        tail,
        fin:inherit(a,b,'fin'),
        mouth:inherit(a,b,'mouth'),
        pattern:inherit(a,b,'pattern'),
        eyeCount,
        size:blend(a.size,b.size,.62,1.42,.12),
        fatness:blend(a.fatness,b.fatness,.62,1.42,.14),
        eyeSize:blend(a.eyeSize,b.eyeSize,.62,1.5,.13),
        speed:blend(a.speed,b.speed,.5,1.58,.13),
        parts
      };
    }

    function speciesKey(g) { return [g.shape,g.tail,g.fin,g.mouth,g.pattern,g.eyeCount,[...g.parts].sort().join('+')].join('|'); }
    function rarityOf(g) {
      let score=g.parts.length*2+g.mutations.length*3+(MUTANT_TAILS.includes(g.tail)?2:0)+(g.eyeCount>=4?1:0);
      if(g.size<.72||g.size>1.3) score++; if(g.fatness<.72||g.fatness>1.3) score++;
      return score>=9?'legendary':score>=6?'epic':score>=3?'rare':'common';
    }
    function copyGene(g) { return {...g,id:id(),parents:[...g.parents],mutations:[...g.mutations],parts:[...g.parts]}; }

    function fishSvg(g) {
      const ry=clamp(30*g.fatness*(g.shape==='圆胖'?1.1:g.shape==='纤长'?.8:1),19,43);
      const tail=g.tail==='月牙尾'?'M45 50Q14 14 20 7Q52 23 55 50Q52 77 20 93Q14 86 45 50':g.tail==='短尾'?'M50 50L23 28L28 50L23 72Z':MUTANT_TAILS.includes(g.tail)?'M50 50L5 5L29 49L5 95L58 57Z':'M50 50L13 15L23 50L13 85Z';
      const pattern=g.pattern==='斑点'?`<circle cx="90" cy="35" r="8" fill="${g.accent}"/><circle cx="70" cy="61" r="6" fill="${g.accent}"/>`:g.pattern==='条纹'?`<path d="M70 23Q59 50 70 76M94 20Q83 50 94 79" fill="none" stroke="${g.accent}" stroke-width="9" opacity=".6"/>`:'';
      const eyes=Array.from({length:g.eyeCount},(_,i)=>`<circle cx="${138-Math.floor(i/3)*12}" cy="${35+i%3*10}" r="${5*g.eyeSize}" fill="white"/><circle cx="${140-Math.floor(i/3)*12}" cy="${35+i%3*10}" r="2.3" fill="#071824"/>`).join('');
      const extras=(g.parts.includes('独角')?'<path d="M120 22L132 0L138 25" fill="#fff0a8"/>':'')+(g.parts.includes('皇冠')?'<path d="M91 22L95 3L106 14L117 2L123 23Z" fill="#ffd24f"/>':'')+(g.parts.includes('长须')?'<path d="M151 56Q176 66 170 88M151 61Q169 78 157 95" fill="none" stroke="white" stroke-width="2"/>':'')+(g.parts.includes('星斑')?'<text x="94" y="64" fill="#fff6a8" font-size="20">★</text>':'');
      const glow=g.parts.includes('发光鳍')?'filter="url(#glow)"':'';
      const fin=g.fin==='长鳍'?'M82 27Q100 -4 122 27':g.fin==='蝶鳍'?'M80 28Q94 2 106 26Q118 3 126 29':g.fin==='刺鳍'?'M79 28L88 8L98 27L110 5L123 29':'M88 28Q103 12 116 28';
      const mouth=g.mouth==='嘟嘴'?'M150 56Q170 50 153 65':g.mouth==='尖吻'?'M150 54L170 60L151 64':g.mouth==='方嘴'?'M150 54H164V64H151':'M150 58Q158 65 165 57';
      return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 100"><defs><linearGradient id="g${g.id}"><stop stop-color="${g.accent}"/><stop offset="1" stop-color="${g.color}"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><path d="${tail}${g.parts.includes('双尾')?'M48 48L11 27L25 52L12 75L55 56Z':''}" fill="${g.accent}" ${glow}/><ellipse cx="100" cy="50" rx="58" ry="${ry}" fill="url(#g${g.id})" ${glow}/>${pattern}<path d="${fin}" fill="${g.accent}"/>${extras}${eyes}<path d="${mouth}" fill="none" stroke="#572c3a" stroke-width="3"/></svg>`;
    }

    function addFish(g,position) {
      if(FISHES.length>=MAX_FISH) { say('鱼缸已满，请先放生一条鱼'); return null; }
      const rarity=rarityOf(g), meta=RARITIES[rarity], node=document.createElement('button');
      node.className='fish'; node.type='button'; node.innerHTML=`<span class="art">${fishSvg(g)}</span><span class="tag"><strong>${clean(g.name)}</strong><b class="badge" style="--rarity:${meta.color}">${meta.label}</b><span>${g.generation?`第 ${g.generation} 代`:'野生'}</span></span>`;
      node.addEventListener('click',event=>{event.stopPropagation();chooseFish(g.id,event.shiftKey)});
      const box=aquarium.getBoundingClientRect(), angle=range(0,Math.PI*2);
      const fish={
        gene:g,
        node,
        art:node.querySelector('.art'),
        x:position?.x??range(80,box.width-80),
        y:position?.y??range(55,box.height-100),
        vx:Math.cos(angle)*35*g.speed,
        vy:Math.sin(angle)*14*g.speed,
        targetVx:Math.cos(angle)*45*g.speed,
        targetVy:Math.sin(angle)*18*g.speed,
        wander:range(2,6),
        facing:1
      };
      FISHES.push(fish);
      aquarium.append(node);
      const key=speciesKey(g), existing=CODEX.get(key);
      if(!existing||RARITIES[rarityOf(g)].rank>RARITIES[rarityOf(existing)].rank) {
        CODEX.set(key,{...g,parents:[...g.parents],mutations:[...g.mutations],parts:[...g.parts]});
      }
      updateUI(); return fish;
    }

    function chooseFish(fishId,shift) {
      if(shift&&selected&&selected!==fishId) return breed(selected,fishId);
      if(pairing) {
        if(!firstParent) { firstParent=fishId; say('已选择第一位亲本'); }
        else if(firstParent!==fishId) breed(firstParent,fishId);
      } else selected=fishId;
      updateUI();
    }

    function setPairMode(on,announce=true) {
      pairing=on; firstParent=null; pairButton.classList.toggle('active',on); tank.classList.toggle('pairing',on); pairButton.textContent=on?'取消配对':'💕 配对繁殖';
      if(announce) say(on?'请依次选择两条鱼':'已退出配对模式');
      updateUI();
    }

    function breed(aId,bId) {
      if(FISHES.length>=MAX_FISH) { setPairMode(false,false); say('鱼缸已满，无法繁殖'); return; }
      const a=FISHES.find(f=>f.gene.id===aId), b=FISHES.find(f=>f.gene.id===bId);
      if(!a||!b) return;
      const gene=crossGenes(a.gene,b.gene), child=addFish(gene,{x:(a.x+b.x)/2,y:(a.y+b.y)/2});
      selected=gene.id; setPairMode(false,false);
      const mutation=gene.mutations.length?`，突变：${gene.mutations.join('、')}`:'，无突变';
      say(`${gene.name} 诞生：${RARITIES[rarityOf(gene)].label}${mutation}`); updateUI();
    }

    function updateUI() {
      document.querySelector('#population').textContent=`鱼群 ${FISHES.length} / ${MAX_FISH}`;
      FISHES.forEach(f=>{f.node.classList.toggle('selected',f.gene.id===selected);f.node.classList.toggle('parent',f.gene.id===firstParent)});
      renderInspector(); renderCodex();
    }

    function renderInspector() {
      const fish=FISHES.find(f=>f.gene.id===selected);
      if(!fish) { inspector.innerHTML='<h2>基因观察台</h2><p class="empty">点击一条鱼查看基因。选中后 Shift+点击另一条可快速繁殖。</p>'; return; }
      const g=fish.gene, rarity=RARITIES[rarityOf(g)];
      inspector.innerHTML=`<h2>${clean(g.name)} <span class="badge" style="--rarity:${rarity.color}">${rarity.label}</span></h2><dl><dt>编号 / 代数</dt><dd>${g.id} / ${g.generation||'野生'}</dd><dt>体型</dt><dd>${g.shape} · ${g.fatness.toFixed(2)}</dd><dt>尺寸 / 速度</dt><dd>${g.size.toFixed(2)} / ${g.speed.toFixed(2)}</dd><dt>眼睛</dt><dd>${g.eyeCount} × ${g.eyeSize.toFixed(2)}</dd><dt>尾 / 鳍 / 嘴</dt><dd>${g.tail} / ${g.fin} / ${g.mouth}</dd><dt>花纹 / 部件</dt><dd>${g.pattern} / ${g.parts.join('、')||'无'}</dd></dl><div class="inspector-actions"><button id="mate">💕 选择配偶</button><button id="export-fish">导出 SVG</button><button id="release" class="danger">放生</button></div>`;
      document.querySelector('#mate').onclick=()=>{setPairMode(true,false);firstParent=g.id;updateUI();say('已选择第一位亲本')};
      document.querySelector('#export-fish').onclick=()=>download(`${g.id}.svg`,fishSvg(g),'image/svg+xml');
      document.querySelector('#release').onclick=()=>{FISHES.splice(FISHES.indexOf(fish),1);fish.node.remove();selected=null;setPairMode(false,false);say(`${g.name} 已放生`)};
    }

    function renderCodex() {
      const genes=[...CODEX.values()].sort((a,b)=>RARITIES[rarityOf(b)].rank-RARITIES[rarityOf(a)].rank);
      document.querySelector('#codex-count').textContent=genes.length;
      const grid=document.querySelector('#codex-grid'); grid.innerHTML=genes.length?'':'<p class="empty">还没有收录物种。</p>';
      genes.forEach(g=>{const rarity=RARITIES[rarityOf(g)],button=document.createElement('button');button.className='species';button.style.setProperty('--rarity',rarity.color);button.innerHTML=`${fishSvg(g)}<span><strong>${clean(g.name)}</strong><small>${rarity.label} · ${g.generation?`第 ${g.generation} 代`:'野生'}</small></span>`;button.onclick=()=>{const clone=copyGene(g);if(addFish(clone))say(`复育了 ${clone.name}`)};grid.append(button)});
    }

    function normalizeGene(raw) {
      const color=x=>/^#[\da-f]{3}([\da-f]{3})?$/i.test(x)||/^hsl\([\d.]+ [\d.]+% [\d.]+%\)$/.test(x);
      if(!raw||!SHAPES.includes(raw.shape)||!color(raw.color)||!color(raw.accent)) return null;
      return {
        id:id(), name:clean(raw.name)||'导入鱼', generation:clamp(Math.round(+raw.generation||0),0,999),
        parents:Array.isArray(raw.parents)?raw.parents.map(clean).slice(0,2):[],
        mutations:Array.isArray(raw.mutations)?raw.mutations.map(clean).slice(0,8):[],
        color:raw.color, accent:raw.accent, shape:raw.shape,
        tail:[...TAILS,...MUTANT_TAILS].includes(raw.tail)?raw.tail:'扇尾',
        fin:FINS.includes(raw.fin)?raw.fin:'短鳍', mouth:MOUTHS.includes(raw.mouth)?raw.mouth:'微笑',
        pattern:PATTERNS.includes(raw.pattern)?raw.pattern:'纯色', eyeCount:clamp(Math.round(+raw.eyeCount||1),1,6),
        size:clamp(+raw.size||1,.62,1.42), fatness:clamp(+raw.fatness||1,.62,1.42),
        eyeSize:clamp(+raw.eyeSize||1,.62,1.5), speed:clamp(+raw.speed||1,.5,1.58),
        parts:Array.isArray(raw.parts)?raw.parts.filter(x=>PARTS.includes(x)):[]
      };
    }

    function download(name,text,type) { const a=document.createElement('a'),url=URL.createObjectURL(new Blob([text],{type}));a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),500); }
    function say(text) { document.querySelector('#message').textContent=text; }

    // 游戏循环：意图 → 惯性 → 积分 → 碰壁 → 渲染。
    function tick(now) {
      const dt=Math.min((now-lastTime)/1000,.05);
      const box=aquarium.getBoundingClientRect();
      lastTime=now;

      for(const f of FISHES) {
        const g=f.gene;

        // 1. 意图：每隔 2~6 秒选择新的目标速度。
        f.wander-=dt;
        if(f.wander<=0) {
          f.targetVx=pick([-1,1])*range(30,58)*g.speed;
          f.targetVy=range(-22,22)*g.speed;
          f.wander=range(2,6);
        }

        // 2. 惯性；3. 用真实 dt 积分位置。
        const ease=1-Math.exp(-2.4*dt);
        f.vx+=(f.targetVx-f.vx)*ease;
        f.vy+=(f.targetVy-f.vy)*ease;
        f.x+=f.vx*dt;
        f.y+=f.vy*dt;

        // 4. 碰壁时同时反转当前速度和目标速度。
        const marginX=65*g.size;
        const marginY=38*g.size;
        if(f.x<marginX||f.x>box.width-marginX) {
          f.x=clamp(f.x,marginX,box.width-marginX);
          f.vx*=-1;
          f.targetVx*=-1;
        }
        if(f.y<marginY||f.y>box.height-marginY-40) {
          f.y=clamp(f.y,marginY,box.height-marginY-40);
          f.vy*=-1;
          f.targetVy*=-1;
        }

        // 5. 鱼体翻转，铭牌保持正向。
        if(Math.abs(f.vx)>2) f.facing=f.vx<0?-1:1;
        f.node.style.transform=`translate3d(${f.x-75}px,${f.y-41}px,0) scale(${g.size})`;
        f.art.style.transform=`scaleX(${f.facing})`;
        f.node.style.zIndex=Math.round(f.y);
      }
      requestAnimationFrame(tick);
    }

    document.querySelector('#hatch-form').onsubmit=event=>{event.preventDefault();const g=randomGene(document.querySelector('#description').value.trim());if(addFish(g))say(`${g.name} 已孵化`)};
    document.querySelector('#random-button').onclick=()=>{const g=randomGene('随机变异');if(addFish(g))say(`${g.name} 已加入鱼缸`)};
    pairButton.onclick=()=>setPairMode(!pairing);
    aquarium.onclick=()=>{if(!pairing){selected=null;updateUI()}};
    document.querySelector('#export-codex').onclick=()=>download('fish-lab-codex.json',JSON.stringify({version:1,species:[...CODEX.values()]},null,2),'application/json');
    document.querySelector('#import-codex').onclick=()=>document.querySelector('#codex-file').click();
    document.querySelector('#codex-file').onchange=async event=>{try{const data=JSON.parse(await event.target.files[0].text());if(!Array.isArray(data.species))throw Error();data.species.map(normalizeGene).filter(Boolean).forEach(g=>CODEX.set(speciesKey(g),g));renderCodex();say('图鉴导入成功')}catch{say('图鉴文件无效')}event.target.value=''};

    requestAnimationFrame(()=>{addFish(randomGene('金色活泼小鱼'));addFish(randomGene('蓝色瘦长安静'));addFish(randomGene('红色圆滚滚'));say('三条野生鱼已经入住');lastTime=performance.now();requestAnimationFrame(tick)});
  </script>
</body>
</html>
